spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/siseg?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.storage.upload-dir=/app/uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

jwt.public.key=file:/app/secrets/app.pub
jwt.private.key=file:/app/secrets/app.key
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:3600}

payment.service.url=${PAYMENT_SERVICE_URL:http://host.docker.internal:8081}
payment.service.key=${PAYMENT_SERVICE_KEY:dev-payment-key}

asaas.baseUrl=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.apiKey=${ASAAS_API_KEY:change-me}
asaas.webhookSecret=${ASAAS_WEBHOOK_SECRET:}

geocoding.locationiq.baseUrl=${LOCATIONIQ_BASE_URL:https://us1.locationiq.com/v1}
geocoding.locationiq.apiKey=${LOCATIONIQ_API_KEY:pk.change-me}
geocoding.locationiq.rateLimitMs=${LOCATIONIQ_RATE_LIMIT_MS:2000}
geocoding.viacep.baseUrl=${VIACEP_BASE_URL:https://viacep.com.br}
geocoding.osrm.baseUrl=${OSRM_BASE_URL:https://router.project-osrm.org}

geocoding.osrm.timeout=5000
geocoding.osrm.retry.maxAttempts=3
geocoding.osrm.retry.delay=1000
