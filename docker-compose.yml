services:
  jwt-init:
    image: alpine:3.20
    container_name: sigeg-jwt-init
    volumes:
      - jwt_secrets:/secrets
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        if [ ! -f /secrets/app.key ]; then
          apk add --no-cache openssl >/dev/null
          openssl genrsa -out /secrets/app.key 2048
          openssl rsa -in /secrets/app.key -pubout -out /secrets/app.pub
          chmod 644 /secrets/app.key
          chmod 644 /secrets/app.pub
        fi

  pagamento:
    build:
      context: ../sigeg-pagamento-service
      dockerfile: Dockerfile
    container_name: sigeg-pagamento
    restart: unless-stopped
    depends_on:
      jwt-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${PAYMENT_SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/siseg_pagamento?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      PEDIDO_SERVICE_URL: ${PEDIDO_SERVICE_URL:-http://api:8080}
      PEDIDO_SERVICE_KEY: ${PEDIDO_SERVICE_KEY:-dev-payment-key}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-change-me}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
    ports:
      - "${PAGAMENTO_PORT:-8081}:8081"
    volumes:
      - jwt_secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigeg-api
    restart: unless-stopped
    depends_on:
      jwt-init:
        condition: service_completed_successfully
      pagamento:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/siseg?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://pagamento:8081}
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:-dev-payment-key}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-change-me}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      LOCATIONIQ_BASE_URL: ${LOCATIONIQ_BASE_URL:-https://us1.locationiq.com/v1}
      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY:-pk.change-me}
      LOCATIONIQ_RATE_LIMIT_MS: ${LOCATIONIQ_RATE_LIMIT_MS:-2000}
      VIACEP_BASE_URL: ${VIACEP_BASE_URL:-https://viacep.com.br}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - jwt_secrets:/app/secrets:ro
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  jwt_secrets:
  uploads_data:
